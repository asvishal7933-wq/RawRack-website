<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RawRack — Orders</title><link rel="stylesheet" href="/styles.css"><style>.admin{padding:35px 28px}.admin h1{font-size:70px;letter-spacing:-.07em;margin:10px 0 30px}.login{display:flex;gap:10px;max-width:500px}.login input{padding:13px;border:1px solid #171717;flex:1}.order{border:1px solid #171717;background:#eee;padding:20px;margin:12px 0}.orderTop{display:flex;justify-content:space-between;gap:10px}.status{padding:6px 8px;background:#171717;color:#fff;font-size:9px;letter-spacing:.1em}.status select{background:#171717;color:#fff;border:0}.items{margin-top:15px;padding-top:15px;border-top:1px solid #aaa;font-size:12px}.wa{background:#25D366!important;border-color:#25D366!important;color:#fff}.muted{color:#666;font-size:11px}@media(max-width:600px){.admin h1{font-size:52px}.orderTop{display:block}.status{display:inline-block;margin-top:10px}}
</style><link rel="icon" href="/assets/rawrack-logo.png"></head><body><div class="topbar">RAWRACK / PRIVATE ORDER MANAGEMENT</div><main class="admin"><span class="eyebrow">KEEP.IT.RAW</span><h1>ORDERS.</h1><div class="login"><input id="key" type="password" placeholder="Admin key"><button class="btn" onclick="loadOrders()">LOAD ORDERS</button></div><p id="err" class="muted"></p><div id="orders"></div></main><script>
let key="";async function loadOrders(){key=document.getElementById("key").value;const r=await fetch("/api/admin/orders",{headers:{"x-admin-key":key}});const d=await r.json();if(!r.ok){document.getElementById("err").textContent=d.error;return}document.getElementById("orders").innerHTML=d.map(o=>{const msg=encodeURIComponent("Hi "+o.customer.name+", RawRack order "+o.orderNumber+" is currently "+o.status+".");return `<article class="order"><div class="orderTop"><div><b>${o.orderNumber}</b><div class="muted">${new Date(o.createdAt).toLocaleString("en-IN")}</div></div><div><span class="status">${o.status}</span><select onchange="updateStatus('${o.orderNumber}',this.value)"><option value="">Update</option><option>PROCESSING</option><option>CUSTOMIZATION</option><option>READY</option><option>SHIPPED</option><option>DELIVERED</option><option>CANCELLED</option></select></div></div><div class="items"><b>${o.customer.name}</b> · ${o.customer.phone} · ₹${o.amount.toLocaleString("en-IN")}<br>${o.customer.address}, ${o.customer.pincode}<br>${o.items.map(i=>`${i.name} · ${i.size} · ${i.color}${i.designName?" · DESIGN: "+i.designName:""}`).join("<br>")}<br><br><a class="btn wa" target="_blank" href="https://wa.me/91${o.customer.phone.replace(/\\D/g,"")}?text=${msg}">WHATSAPP CUSTOMER →</a></div></article>`}).join("")}
async function updateStatus(orderNumber,status){if(!status)return;const r=await fetch("/api/admin/orders/"+orderNumber+"/status",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":key},body:JSON.stringify({status})});if(!r.ok)alert("Could not update order");else loadOrders()}
</script><div class="mobileNav">
<a href="/"><span>HOME</span></a><a href="/#shop"><span>SHOP</span></a>
<a href="/product.html?id=hoodie"><span>CUSTOMIZE</span></a>
<button onclick="openCart?.()"><span>BAG <b id="mobileBagCount">0</b></span></button>
</div></body></html>
