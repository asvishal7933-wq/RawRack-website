<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RawRack — Product</title><link rel="stylesheet" href="/styles.css"><style>
.product{display:grid;grid-template-columns:1.05fr .95fr;min-height:calc(100vh - 74px)}.stage{background:#727473;display:grid;place-items:center;min-height:650px;padding:40px;position:relative}.stage img.base{width:82%;height:82%;object-fit:cover}.previewMock{width:55%;height:65%;background:#c8c1b5;clip-path:polygon(27% 10%,38% 2%,50% 15%,62% 2%,73% 10%,94% 29%,80% 43%,76% 94%,24% 94%,20% 43%,6% 29%);position:relative;overflow:hidden}.previewMock img{position:absolute;inset:28% 20% auto;width:60%;height:45%;object-fit:contain;mix-blend-mode:multiply}.detail{padding:6vw;border-left:1px solid #171717}.detail h1{font-size:clamp(48px,7vw,100px);line-height:.82;letter-spacing:-.07em;margin:20px 0}.priceBig{font-size:20px;font-weight:800}.detail p{line-height:1.6;color:#555;max-width:500px}.options{border-top:1px solid #171717;margin-top:30px}.opt{padding:18px 0;border-bottom:1px solid #171717}.opt label{display:block;font-size:9px;font-weight:800;letter-spacing:.15em;margin-bottom:10px}.sizes{display:flex;gap:7px;flex-wrap:wrap}.size{border:1px solid #171717;background:transparent;padding:11px 16px;font-size:11px}.size.active,.size:hover{background:#171717;color:#fff}.colors{display:flex;gap:8px}.color{width:30px;height:30px;border:1px solid #171717;border-radius:50%}.upload{border:1px dashed #777;padding:20px;text-align:center;font-size:11px}.upload input{display:block;margin:12px auto 0;width:100%}.note{width:100%;padding:13px;border:1px solid #171717}.previewStatus{font-size:10px;color:#b51f24;margin-top:8px;min-height:15px}@media(max-width:800px){.product{grid-template-columns:1fr}.detail{border-left:0;border-top:1px solid #171717}.stage{min-height:500px}}
</style><link rel="icon" href="/assets/rawrack-logo.png"></head><body><div class="topbar">BANGALORE ONLY · CUSTOM STREETWEAR</div><header><nav><a class="brand" href="/"><img src="/assets/rawrack-logo.png"></a><div class="links"><a href="/#shop">SHOP</a><a href="/product.html?id=hoodie">CUSTOMIZE</a><a href="/#about">ABOUT</a></div><div class="actions"><button onclick="goCart()">BAG <b id="bagCount">0</b></button></div></nav></header>
<main class="product"><section class="stage"><img id="baseImage" class="base" src="/assets/diet-coke-hoodie.jpg"><div id="liveMock" class="previewMock" style="display:none"><img id="designPreview"></div></section>
<section class="detail"><span class="eyebrow" id="category">CUSTOM / 001</span><h1 id="name">CUSTOM HOODIE</h1><div class="priceBig" id="price">₹1,999</div><p id="desc">Heavyweight custom hoodie built for graphic pieces and personal designs.</p>
<div class="options"><div class="opt"><label>SIZE</label><div class="sizes"><button class="size active">S</button><button class="size">M</button><button class="size">L</button><button class="size">XL</button><button class="size">XXL</button></div></div>
<div class="opt"><label>COLOUR</label><div class="colors"><button class="color" title="Concrete Grey" style="background:#9b9b98" data-color="Concrete Grey"></button><button class="color" title="Off White" style="background:#eee" data-color="Off White"></button><button class="color" title="Black" style="background:#222" data-color="Black"></button><button class="color" title="Raw Red" style="background:#b51f24" data-color="Raw Red"></button></div><div id="chosenColor" style="font-size:10px;margin-top:8px">Concrete Grey</div></div>
<div class="opt"><label>UPLOAD YOUR DESIGN</label><div class="upload">PNG / JPG / WEBP · MAX 8MB<input type="file" id="design" accept=".png,.jpg,.jpeg,.webp"><div class="previewStatus" id="uploadStatus"></div></div></div>
<div class="opt"><label>DESIGN NOTE</label><textarea class="note" id="note" rows="3" placeholder="Tell us where / how you want the design placed..."></textarea></div>
</div><button class="btn" style="width:100%;margin-top:20px" onclick="addToBag()">ADD TO BAG · <span id="addPrice">₹1,999</span></button><a class="btn ghost" style="width:100%;text-align:center;margin-top:8px" href="/#shop">BACK TO SHOP</a>
</section></main><script src="/app.js"></script><script>
const params=new URLSearchParams(location.search), id=params.get("id")||"hoodie";let product=null,designUrl="",designName="",chosenSize="S",chosenColor="Concrete Grey";
(async()=>{const ps=await products();product=ps.find(p=>p.id===id)||ps[0];document.getElementById("name").textContent=product.name.toUpperCase();document.getElementById("price").textContent=money(product.price);document.getElementById("addPrice").textContent=money(product.price);document.getElementById("category").textContent=product.category+" / CUSTOM";document.getElementById("desc").textContent=product.description;if(product.id!=="hoodie"){document.getElementById("baseImage").style.display="none";document.getElementById("liveMock").style.display="block"}})();
document.querySelectorAll(".size").forEach(b=>b.onclick=()=>{document.querySelectorAll(".size").forEach(x=>x.classList.remove("active"));b.classList.add("active");chosenSize=b.textContent});
document.querySelectorAll(".color").forEach(b=>b.onclick=()=>{chosenColor=b.dataset.color;document.getElementById("chosenColor").textContent=chosenColor;if(document.getElementById("liveMock"))document.getElementById("liveMock").style.background=b.style.background});
document.getElementById("design").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>8*1024*1024){alert("Design must be under 8MB.");return}document.getElementById("uploadStatus").textContent="Uploading design...";const fd=new FormData();fd.append("design",f);const r=await fetch("/api/upload-design",{method:"POST",body:fd});const d=await r.json();if(!r.ok){document.getElementById("uploadStatus").textContent=d.error;return}designUrl=d.url;designName=d.filename;document.getElementById("uploadStatus").textContent="✓ "+d.filename;const reader=new FileReader();reader.onload=()=>{document.getElementById("designPreview").src=reader.result};reader.readAsDataURL(f)};
function addToBag(){if(!product)return;addItem(product.id,chosenSize,chosenColor,designUrl,designName,document.getElementById("note").value)}
function goCart(){location.href="/checkout.html"}
</script><div class="mobileNav">
<a href="/"><span>HOME</span></a><a href="/#shop"><span>SHOP</span></a>
<a href="/product.html?id=hoodie"><span>CUSTOMIZE</span></a>
<button onclick="openCart?.()"><span>BAG <b id="mobileBagCount">0</b></span></button>
</div></body></html>
