<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RawRack — Track Order</title><link rel="stylesheet" href="/styles.css"><style>.track{max-width:700px;margin:auto;padding:12vw 20px;text-align:center}.track h1{font-size:80px;letter-spacing:-.08em;line-height:.8}.track input{width:100%;padding:15px;border:1px solid #171717;margin:10px 0;background:#777;color:#fff}.result{margin-top:25px;border:1px solid #171717;padding:25px;text-align:left;background:#686a68}.pill{display:inline-block;background:#171717;color:#fff;padding:8px;font-size:9px;letter-spacing:.12em}</style></head><body><div class="topbar">RAWRACK / ORDER TRACKING</div><header><nav><a class="brand" href="/"><img src="/assets/rawrack-logo.png"></a><div class="links"><a href="/#shop">SHOP</a><a href="/product.html?id=hoodie">CUSTOMIZE</a><a href="/faq.html">FAQ</a></div></nav></header><main class="track"><span class="eyebrow">KEEP.IT.RAW</span><h1>TRACK<br>IT.</h1><input id="num" placeholder="Enter order number e.g. RR12345678"><button class="btn" style="width:100%" onclick="track()">CHECK STATUS →</button><div id="result"></div></main><script>async function track(){const n=document.getElementById("num").value.trim();const el=document.getElementById("result");if(!n){el.textContent="Enter an order number.";return}const r=await fetch("/api/orders/"+encodeURIComponent(n));const d=await r.json();if(!r.ok){el.textContent=d.error||"Order not found.";return}el.innerHTML="<div class='result'><span class='pill'>"+d.status+"</span><h3>"+d.orderNumber+"</h3><p>Payment: "+d.paymentStatus+"</p><p>Total: ₹"+d.amount.toLocaleString("en-IN")+"</p></div>"}</script></body></html>
