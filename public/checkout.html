<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RawRack — Checkout</title><link rel="stylesheet" href="/styles.css"><style>
.checkout{display:grid;grid-template-columns:1.15fr .85fr;min-height:calc(100vh - 74px)}.form{padding:6vw;border-right:1px solid #171717}.form h1,.summary h2{font-size:clamp(50px,7vw,90px);letter-spacing:-.07em;line-height:.82;margin:20px 0 35px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:9px;font-weight:800;letter-spacing:.14em;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #171717;background:#fff}.summary{background:#686a68;color:#fff;padding:6vw}.sumrow{display:flex;justify-content:space-between;border-bottom:1px solid #aaa;padding:14px 0;font-size:12px}.error{color:#b51f24;font-size:11px;min-height:18px;margin:10px 0}.wa{background:#25D366!important;border-color:#25D366!important}.small{font-size:10px;color:#666;line-height:1.6}@media(max-width:800px){.checkout{grid-template-columns:1fr}.summary{border-top:1px solid #171717}.fields{grid-template-columns:1fr}}
</style><link rel="icon" href="/assets/rawrack-logo.png"></head><body><div class="topbar">SECURE CHECKOUT · BANGALORE ONLY</div><header><nav><a class="brand" href="/"><img src="/assets/rawrack-logo.png"></a><div></div><div class="actions"><a href="/#shop">BACK TO SHOP</a></div></nav></header><main class="checkout"><section class="form"><span class="eyebrow">RAWRACK / CHECKOUT</span><h1>ALMOST<br>RAW.</h1><div class="fields"><div class="field"><label>FULL NAME *</label><input id="name"></div><div class="field"><label>PHONE *</label><input id="phone" inputmode="numeric"></div><div class="field full"><label>EMAIL</label><input id="email" type="email"></div><div class="field full"><label>DELIVERY ADDRESS *</label><input id="address" placeholder="House / street / area"></div><div class="field"><label>PINCODE *</label><input id="pincode" inputmode="numeric" placeholder="Bangalore pincode"></div><div class="field"><label>PAYMENT</label><input value="Razorpay · UPI / Cards / Net Banking" disabled></div></div><div class="error" id="error"></div><button class="btn" style="width:100%" onclick="pay()">PAY SECURELY →</button><p class="small">Your payment is processed through Razorpay. RawRack does not store card/UPI credentials.</p></section><aside class="summary"><span class="eyebrow">YOUR BAG</span><h2>ORDER.</h2><div id="items"></div><div class="sumrow"><b>TOTAL</b><b id="total">₹0</b></div><p class="small">Bangalore delivery only. Custom pieces are produced after order confirmation.</p></aside></main><script src="/app.js"></script><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>
async function load(){const ps=await products();const el=document.getElementById("items");if(!cart.length){el.innerHTML="<p>Your bag is empty. <a href='/#shop'><u>Shop now.</u></a></p>";return}let total=0;el.innerHTML=cart.map(i=>{const p=ps.find(x=>x.id===i.productId);total+=p.price*i.quantity;return `<div class="sumrow"><span>${p.name}<br><small>${i.size} · ${i.color}${i.designName?" · custom design":""}</small></span><b>${money(p.price*i.quantity)}</b></div>`}).join("");document.getElementById("total").textContent=money(total)}load();
async function pay(){
 if(!cart.length)return;
 const error=document.getElementById("error");error.textContent="";
 const customer={name:document.getElementById("name").value.trim(),phone:document.getElementById("phone").value.trim(),email:document.getElementById("email").value.trim(),address:document.getElementById("address").value.trim(),pincode:document.getElementById("pincode").value.trim()};
 if(!customer.name||!customer.phone||!customer.address||!customer.pincode){error.textContent="Please fill all required fields.";return}
 const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items:cart,customer})});const d=await r.json();if(!r.ok){error.textContent=d.error||"Could not create order.";return}
 if(d.demoMode){localStorage.setItem("rr_order",d.orderNumber);await fetch("/api/payment/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({orderNumber:d.orderNumber})});localStorage.removeItem("rr_cart");location.href="/success.html?order="+d.orderNumber;return}
 const options={key:d.keyId,amount:d.amount*100,currency:"INR",name:"RawRack",description:"Keep.It.Raw",order_id:d.razorpayOrderId,prefill:{name:customer.name,email:customer.email,contact:customer.phone},theme:{color:"#b51f24"},handler:async function(resp){
   const vr=await fetch("/api/payment/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({orderNumber:d.orderNumber,razorpay_order_id:resp.razorpay_order_id,razorpay_payment_id:resp.razorpay_payment_id,razorpay_signature:resp.razorpay_signature})});
   const vd=await vr.json();if(!vr.ok){error.textContent=vd.error||"Payment verification failed.";return}
   localStorage.removeItem("rr_cart");location.href="/success.html?order="+d.orderNumber;
 },modal:{ondismiss:function(){error.textContent="Payment window closed. Your order remains pending."}};
 new Razorpay(options).open();
}
</script><div class="mobileNav">
<a href="/"><span>HOME</span></a><a href="/#shop"><span>SHOP</span></a>
<a href="/product.html?id=hoodie"><span>CUSTOMIZE</span></a>
<button onclick="openCart?.()"><span>BAG <b id="mobileBagCount">0</b></span></button>
</div></body></html>
